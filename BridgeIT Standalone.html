/* ============================== LOGO ============================== */
function LogoMark({ size = 32 }) {
  return (
    <img
      src={LOGO_ICON}
      alt="BridgeIT"
      draggable={false}
      className="select-none shrink-0"
      style={{ width: size, height: "auto" }}
    />
  );
}

function LogoFull({ width = 220 }) {
  return (
    <img
      src={LOGO_FULL}
      alt="BridgeIT \u2014 Pass it over. Safely."
      draggable={false}
      className="select-none"
      style={{ width, height: "auto" }}
    />
  );
}

function Logo({ size = 40, withText = true, tone = "dark" }) {
  const textColor = tone === "dark" ? "#0F172A" : "#F8FAFC";
  const sub = tone === "dark" ? "#5B6472" : "#CBD5E1";
  return (
    <div className="flex items-center gap-2.5 select-none">
      <LogoMark size={size} />
      {withText && (
        <div className="leading-tight">
          <div style={{ fontFamily: F_DISPLAY, color: textColor }} className="text-lg font-bold tracking-tight">
            BridgeIT
          </div>
          <div style={{ fontFamily: F_BODY, color: sub }} className="text-xs font-medium tracking-wide">
            Pass it over. Safely.
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== HELPERS ============================== */
function timeAgo(ts) {
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return `${diffMin}m ago`;
  const h = Math.floor(diffMin / 60);
  return `${h}h ${diffMin % 60}m ago`;
}
function fmtClock(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function riskStyle(level) {
  switch (level) {
    case "Unstable": return "bg-rose-100 text-rose-700 ring-1 ring-rose-200";
    case "High": return "bg-orange-100 text-orange-700 ring-1 ring-orange-200";
    case "Moderate": return "bg-amber-100 text-amber-700 ring-1 ring-amber-200";
    default: return "bg-emerald-100 text-emerald-700 ring-1 ring-emerald-200";
  }
}
function statusStyle(status) {
  switch (status) {
    case "Acknowledged": return "bg-emerald-100 text-emerald-700 ring-1 ring-emerald-200";
    case "Pending Acknowledgment": return "bg-amber-100 text-amber-700 ring-1 ring-amber-200";
    default: return "bg-slate-100 text-slate-600 ring-1 ring-slate-200";
  }
}
function taskStyle(status) {
  switch (status) {
    case "Completed": return "bg-emerald-50 text-emerald-700 border-emerald-200";
    case "In Progress": return "bg-sky-50 text-sky-700 border-sky-200";
    default: return "bg-slate-50 text-slate-600 border-slate-200";
  }
}
function uid(prefix) {
  return `${prefix}-${Math.random().toString(36).slice(2, 8)}`;
}

/* ============================== NEW HANDOVER FORM ============================== */
function NewHandoverForm({ user, onCreate, showToast }) {
  const blank = { patientRef: "", identification: "", situation: "", background: "", assessment: "", recommendation: "", riskLevel: "Low" };
  const [f, setF] = useState(blank);
  const [tasks, setTasks] = useState([]);
  const [override, setOverride] = useState(false);
  const [overrideReason, setOverrideReason] = useState("Active Resuscitation in Progress");
  const [taskDraft, setTaskDraft] = useState({ description: "", owner: "Incoming Physician", priority: "Routine" });

  const requiredFilled = f.patientRef && f.identification && f.situation && f.background && f.assessment && f.recommendation;
  const canSubmit = override || requiredFilled;

  function addTask() {
    if (!taskDraft.description.trim()) return;
    setTasks((t) => [...t, { id: uid("t"), status: "Pending", ...taskDraft }]);
    setTaskDraft({ description: "", owner: "Incoming Physician", priority: "Routine" });
  }
  function removeTask(id) {
    setTasks((t) => t.filter((x) => x.id !== id));
  }
  function submit() {
    if (!canSubmit) return;
    onCreate({
      ...f,
      tasks,
      overrideUsed: override,
      overrideReason: override ? overrideReason : undefined,
    });
    setF(blank);
    setTasks([]);
    setOverride(false);
    showToast("Handover submitted \u00b7 incoming physician notified");
  }

  const field = (label, key, placeholder, textarea = false) => (
    <div className="mb-4">
      <label className="block text-xs font-semibold text-slate-600 mb-1.5">{label}</label>
      {textarea ? (
        <textarea
          value={f[key]}
          onChange={(e) => setF({ ...f, [key]: e.target.value })}
          placeholder={override ? placeholder + " (optional under override)" : placeholder}
          rows={2}
          className="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent resize-none placeholder:text-slate-400"
        />
      ) : (
        <input
          value={f[key]}
          onChange={(e) => setF({ ...f, [key]: e.target.value })}
          placeholder={override ? placeholder + " (optional under override)" : placeholder}
          className="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent placeholder:text-slate-400"
        />
      )}
    </div>
  );

  return (
    <div className="max-w-3xl mx-auto pb-24">
      <div className="mb-6">
        <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900">New handover</h1>
        <p className="text-sm text-slate-500 mt-1">Structured around ISBAR. Fields marked required must be completed unless you use the clinical override.</p>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-5">
        {field("Patient reference (bed / age / sex)", "patientRef", "e.g. Bed 4B \u00b7 62F")}
        <div className="mb-4">
          <label className="block text-xs font-semibold text-slate-600 mb-2">Risk stratification</label>
          <div className="flex flex-wrap gap-2">
            {RISK_LEVELS.map((r) => (
              <button
                key={r}
                onClick={() => setF({ ...f, riskLevel: r })}
                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-colors ${
                  f.riskLevel === r ? riskStyle(r) + " border-transparent" : "border-slate-200 text-slate-400 hover:border-slate-300"
                }`}
              >
                {r}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-5">
        <div style={{ fontFamily: F_DISPLAY }} className="text-sm font-bold text-slate-900 mb-4">ISBAR structured summary</div>
        {field("Identification", "identification", "Age, sex, admitting diagnosis, day of admission\u2026")}
        {field("Situation", "situation", "What is happening right now?", true)}
        {field("Background", "background", "Relevant history, allergies, current medications\u2026", true)}
        {field("Assessment", "assessment", "Your clinical assessment of the current state\u2026", true)}
        {field("Recommendation", "recommendation", "What should the incoming team do next?", true)}
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-5">
        <div style={{ fontFamily: F_DISPLAY }} className="text-sm font-bold text-slate-900 mb-1">Active task list</div>
        <p className="text-xs text-slate-500 mb-4">Every open task needs an explicit owner. Nothing is handed over unassigned.</p>

        {tasks.length > 0 && (
          <div className="space-y-2 mb-4">
            {tasks.map((t) => (
              <div key={t.id} className="flex items-center justify-between gap-3 rounded-xl border border-slate-200 px-3.5 py-2.5">
                <div className="min-w-0">
                  <div className="text-sm text-slate-800 truncate">{t.description}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{t.owner} \u00b7 {t.priority}</div>
                </div>
                <button onClick={() => removeTask(t.id)} className="shrink-0 text-slate-300 hover:text-rose-500">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>
        )}

        <div className="flex flex-col sm:flex-row gap-2">
          <input
            value={taskDraft.description}
            onChange={(e) => setTaskDraft({ ...taskDraft, description: e.target.value })}
            placeholder="e.g. Chase 08:00 chest X-ray result"
            className="flex-1 rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent placeholder:text-slate-400"
          />
          <select
            value={taskDraft.owner}
            onChange={(e) => setTaskDraft({ ...taskDraft, owner: e.target.value })}
            className="rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none bg-white"
          >
            <option>Incoming Physician</option>
            <option>Nurse</option>
            <option>Outgoing Physician</option>
          </select>
          <select
            value={taskDraft.priority}
            onChange={(e) => setTaskDraft({ ...taskDraft, priority: e.target.value })}
            className="rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none bg-white"
          >
            {PRIORITIES.map((p) => <option key={p}>{p}</option>)}
          </select>
          <button
            onClick={addTask}
            disabled={!taskDraft.description.trim()}
            className="rounded-xl bg-slate-900 text-white px-4 py-2.5 text-sm font-semibold flex items-center gap-1.5 justify-center hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed"
          >
            <Plus className="w-4 h-4" /> Add
          </button>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-5">
        <div className="flex items-start justify-between gap-4">
          <div>
            <div style={{ fontFamily: F_DISPLAY }} className="text-sm font-bold text-slate-900 flex items-center gap-2">
              <AlertTriangle className="w-4 h-4 text-amber-500" /> Explainable clinical override
            </div>
            <p className="text-xs text-slate-500 mt-1 max-w-md">Bypass mandatory fields only for genuine emergencies. Every use is logged to the audit trail for quality review.</p>
          </div>
          <button
            onClick={() => setOverride((v) => !v)}
            className={`shrink-0 w-11 h-6 rounded-full transition-colors relative ${override ? "bg-amber-500" : "bg-slate-200"}`}
          >
            <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${override ? "left-5" : "left-0.5"}`} />
          </button>
        </div>
        {override && (
          <select
            value={overrideReason}
            onChange={(e) => setOverrideReason(e.target.value)}
            className="mt-4 w-full rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-sm outline-none"
          >
            <option>Active Resuscitation in Progress</option>
            <option>Rapid Response / Code Activation</option>
            <option>Mass Casualty / Surge Event</option>
          </select>
        )}
      </div>

      <div className="sticky bottom-4 flex flex-col items-end gap-1.5">
        {!canSubmit && (
          <span className="text-xs text-rose-500 bg-white px-2.5 py-1 rounded-lg border border-rose-200 shadow-sm">
            Complete all ISBAR fields, or enable the clinical override, to submit.
          </span>
        )}
        <button
          onClick={submit}
          disabled={!canSubmit}
          className="rounded-xl bg-teal-600 text-white px-6 py-3 text-sm font-semibold shadow-lg hover:bg-teal-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2"
        >
          Submit closed-loop handover <ArrowRight className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

      <div className="flex items-start justify-between gap-3 mb-3">
        <div>
          <div style={{ fontFamily: F_DISPLAY }} className="font-bold text-slate-900 text-sm">{h.patientRef}</div>
          <div className="text-xs text-slate-400 mt-0.5">{h.department}</div>
        </div>
        <Pill className={riskStyle(h.riskLevel)}>{h.riskLevel}</Pill>
      </div>
      <p className="text-xs text-slate-500 line-clamp-2 mb-4">{h.situation}</p>
      <div className="flex items-center justify-between">
        <Pill className={statusStyle(h.status)}>{h.status}</Pill>
        <span className="text-xs text-slate-400 flex items-center gap-1"><Clock className="w-3 h-3" />{timeAgo(h.createdAt)}</span>
      </div>
      {h.tasks.length > 0 && (
        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-1.5 text-xs text-slate-400">
          <ListChecks className="w-3.5 h-3.5" /> {h.tasks.filter(t => t.status !== "Completed").length} open task{h.tasks.filter(t => t.status !== "Completed").length !== 1 ? "s" : ""}
        </div>

      <div className="mt-3 text-xs font-semibold text-teal-600 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        View details <ChevronRight className="w-3.5 h-3.5" />
      </div>
    </button>
  );
}

function DetailDrawer({ h, onClose, onAcknowledge, onTaskStatus, canAcknowledge, showToast }) {
  if (!h) return null;
  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-slate-900" style={{ opacity: 0.4 }} onClick={onClose} />
      <div
        className="relative w-full sm:max-w-md bg-white h-full overflow-y-auto shadow-2xl"
        style={{ animation: "slideIn .25s ease" }}
      >
        <div className="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between z-10">
          <div>
            <div style={{ fontFamily: F_DISPLAY }} className="font-bold text-slate-900">{h.patientRef}</div>
            <div className="text-xs text-slate-400">{h.id} \u00b7 {h.department}</div>
          </div>
          <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-100"><X className="w-4 h-4 text-slate-500" /></button>
        </div>

        <div className="p-6">
          <div className="flex items-center gap-2 mb-6">
            <Pill className={riskStyle(h.riskLevel)}>{h.riskLevel} risk</Pill>
            <Pill className={statusStyle(h.status)}>{h.status}</Pill>
            {h.overrideUsed && <Pill className="bg-amber-100 text-amber-700 ring-1 ring-amber-200">Override used</Pill>}
          </div>

          {h.overrideUsed && (
            <div className="mb-5 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs text-amber-700 flex items-start gap-2">
              <AlertTriangle className="w-4 h-4 shrink-0 mt-0.5" />
              <span>Submitted under clinical override: <b>{h.overrideReason}</b>. Logged for quality audit.</span>
            </div>
          )}

          {[
            ["Identification", h.identification],
            ["Situation", h.situation],
            ["Background", h.background],
            ["Assessment", h.assessment],
            ["Recommendation", h.recommendation],
          ].map(([label, val]) => (
            <div key={label} className="mb-4">
              <div className="text-xs font-bold text-teal-700 uppercase tracking-wide mb-1">{label}</div>
              <p className="text-sm text-slate-700 leading-relaxed">{val || <span className="text-slate-300 italic">Not documented (override)</span>}</p>
            </div>
          ))}

          <div className="mt-6 pt-5 border-t border-slate-100">
            <div style={{ fontFamily: F_DISPLAY }} className="text-sm font-bold text-slate-900 mb-3">Task ownership</div>
            <div className="space-y-2">
              {h.tasks.length === 0 && <p className="text-xs text-slate-400">No outstanding tasks logged.</p>}
              {h.tasks.map((t) => (
                <div key={t.id} className={`rounded-xl border px-3.5 py-2.5 ${taskStyle(t.status)}`}>
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    <span className="text-sm font-medium">{t.description}</span>
                    {t.priority === "Urgent" && <Pill className="bg-rose-100 text-rose-600 shrink-0">Urgent</Pill>}
                  </div>
                  <div className="flex items-center justify-between text-xs">
                    <span className="opacity-70">Owner: {t.owner}</span>
                    <select
                      value={t.status}
                      onChange={(e) => onTaskStatus(h.id, t.id, e.target.value)}
                      className="bg-white rounded-lg border border-slate-200 px-2 py-1 text-xs outline-none"
                    >
                      {TASK_STATUSES.map((s) => <option key={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-6 pt-5 border-t border-slate-100 text-xs text-slate-400 space-y-1">
            <div>Submitted by {h.createdBy} \u00b7 {fmtClock(h.createdAt)}</div>
            {h.acknowledgedBy && <div>Acknowledged by {h.acknowledgedBy} \u00b7 {fmtClock(h.acknowledgedAt)}</div>}
          </div>

          <div className="mt-6 flex flex-col sm:flex-row gap-2">
            {canAcknowledge && h.status !== "Acknowledged" && (
              <button
                onClick={() => { onAcknowledge(h.id); showToast("Responsibility accepted \u00b7 logged & timestamped"); onClose(); }}
                className="flex-1 rounded-xl bg-emerald-600 text-white px-4 py-3 text-sm font-semibold flex items-center justify-center gap-2 hover:bg-emerald-700"
              >
                <CheckCircle2 className="w-4 h-4" /> Acknowledge responsibility
              </button>
            )}
            <button
              onClick={() => showToast("Formatted summary sent to ward printer")}
              className="rounded-xl border border-slate-200 text-slate-600 px-4 py-3 text-sm font-semibold flex items-center justify-center gap-2 hover:bg-slate-50"
            >
              <Printer className="w-4 h-4" /> Print summary
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== TASK BOARD (NURSE) ============================== */
function TaskBoard({ handovers, onTaskStatus, showToast }) {
  const rows = useMemo(() => {
    const list = [];
    handovers.forEach((h) => h.tasks.forEach((t) => list.push({ ...t, patientRef: h.patientRef, hId: h.id, risk: h.riskLevel })));
    return list.sort((a, b) => (a.status === "Completed" ? 1 : 0) - (b.status === "Completed" ? 1 : 0));
  }, [handovers]);

  return (
    <div className="max-w-4xl mx-auto">
      <div className="mb-6 flex items-center justify-between">
        <div>
          <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900">Task board</h1>
          <p className="text-sm text-slate-500 mt-1">Every task across active handovers, with a named owner.</p>
        </div>
        <button onClick={() => showToast("Ward summary sent to printer")} className="rounded-xl border border-slate-200 text-slate-600 px-4 py-2.5 text-sm font-semibold flex items-center gap-2 hover:bg-slate-50">
          <Printer className="w-4 h-4" /> Print ward summary
        </button>
      </div>

      {rows.length === 0 ? (
        <EmptyState icon={ListChecks} title="No tasks logged yet" sub="Tasks created during handover will appear here with a clear owner." />
      ) : (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          {rows.map((t, i) => (
            <div key={t.id} className={`flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 px-5 py-4 ${i !== 0 ? "border-t border-slate-100" : ""}`}>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium text-slate-800">{t.description}</div>
                <div className="text-xs text-slate-400 mt-0.5">{t.patientRef} \u00b7 {t.hId}</div>
              </div>
              <Pill className={riskStyle(t.risk) + " hidden sm:inline-flex"}>{t.risk}</Pill>
              <div className="text-xs text-slate-500 w-32 shrink-0">{t.owner}</div>
              {t.priority === "Urgent" && <Pill className="bg-rose-100 text-rose-600 shrink-0">Urgent</Pill>}
              <select
                value={t.status}
                onChange={(e) => onTaskStatus(t.hId, t.id, e.target.value)}
                className={`rounded-lg border px-2.5 py-1.5 text-xs font-medium outline-none shrink-0 ${taskStyle(t.status)}`}
              >
                {TASK_STATUSES.map((s) => <option key={s}>{s}</option>)}
              </select>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================== ADMIN DASHBOARD ============================== */
function StatCard({ icon: Icon, label, value, tone }) {
  const tones = {
    teal: "bg-teal-50 text-teal-600",
    amber: "bg-amber-50 text-amber-600",
    emerald: "bg-emerald-50 text-emerald-600",
    rose: "bg-rose-50 text-rose-600",
  };
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5">
      <div className={`w-9 h-9 rounded-xl flex items-center justify-center mb-3 ${tones[tone]}`}>
        <Icon className="w-5 h-5" />
      </div>
      <div style={{ fontFamily: F_DISPLAY }} className="text-2xl font-bold text-slate-900">{value}</div>
      <div className="text-xs text-slate-500 mt-0.5">{label}</div>
    </div>
  );
}

function AdminDashboard({ handovers }) {
  const total = handovers.length;
  const acknowledged = handovers.filter((h) => h.status === "Acknowledged");
  const pending = handovers.filter((h) => h.status === "Pending Acknowledgment");
  const overdue = pending.filter((h) => Date.now() - h.createdAt > 15 * 60000);

  const within15 = acknowledged.filter((h) => h.acknowledgedAt - h.createdAt <= 15 * 60000).length;
  const hcar = acknowledged.length ? Math.round((within15 / acknowledged.length) * 100) : 0;

  const openTasks = handovers.flatMap((h) => h.tasks).filter((t) => t.status !== "Completed").length;

  return (
    <div className="max-w-5xl mx-auto">
      <div className="mb-6">
        <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900">Ward oversight</h1>
        <p className="text-sm text-slate-500 mt-1">Internal Medicine Ward A \u00b7 live pilot metrics</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <StatCard icon={FileText} label="Handovers today" value={total} tone="teal" />
        <StatCard icon={BellRing} label="Awaiting acknowledgment" value={pending.length} tone="amber" />
        <StatCard icon={AlertTriangle} label="Overdue (>15 min)" value={overdue.length} tone="rose" />
        <StatCard icon={ListChecks} label="Open tasks" value={openTasks} tone="emerald" />
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-8">
        <div className="flex items-center justify-between mb-1">
          <div style={{ fontFamily: F_DISPLAY }} className="text-sm font-bold text-slate-900">Handover Completion & Acknowledgment Rate (HCAR)</div>
          <span style={{ fontFamily: F_MONO }} className="text-2xl font-bold text-teal-600">{hcar}%</span>
        </div>
        <p className="text-xs text-slate-500 mb-4">Share of handovers acknowledged within the 15-minute target window. Pilot target: \u226590%.</p>
        <div className="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
          <div className="h-full bg-teal-500 rounded-full transition-all" style={{ width: `${hcar}%` }} />
        </div>
      </div>

      {overdue.length > 0 && (
        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-5 mb-8">
          <div className="flex items-center gap-2 text-rose-700 font-semibold text-sm mb-3"><AlertTriangle className="w-4 h-4" /> Needs attention</div>
          <div className="space-y-2">
            {overdue.map((h) => (
              <div key={h.id} className="flex items-center justify-between text-sm text-rose-800">
                <span>{h.patientRef} \u00b7 {h.id}</span>
                <span className="text-xs">{timeAgo(h.createdAt)}, unacknowledged</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== AUDIT LOG ============================== */
function actionIcon(action) {
  if (action.includes("Override")) return AlertTriangle;
  if (action.includes("Acknowledged")) return CheckCircle2;
  if (action.includes("Submitted")) return FileText;
  if (action.includes("Task")) return ListChecks;
  return History;
}
function actionColor(action) {
  if (action.includes("Override")) return "text-amber-600 bg-amber-50";
  if (action.includes("Acknowledged")) return "text-emerald-600 bg-emerald-50";
  if (action.includes("Submitted")) return "text-teal-600 bg-teal-50";
  return "text-slate-500 bg-slate-100";
}

function AuditLog({ audit }) {
  const [filter, setFilter] = useState("All");
  const filters = ["All", "Submitted", "Acknowledged", "Override", "Task"];
  const rows = audit
    .filter((a) => filter === "All" || a.action.includes(filter))
    .sort((a, b) => b.ts - a.ts);

  return (
    <div className="max-w-4xl mx-auto">
      <div className="mb-6">
        <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900 flex items-center gap-2">
          <History className="w-5 h-5 text-slate-400" /> Audit log
        </h1>
        <p className="text-sm text-slate-500 mt-1">Every handover event, timestamped and immutable. Read-only after 24 hours.</p>
      </div>

      <div className="flex flex-wrap gap-2 mb-5">
        {filters.map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-colors ${
              filter === f ? "bg-slate-900 text-white" : "bg-white border border-slate-200 text-slate-500 hover:border-slate-300"
            }`}
          >
            {f}
          </button>
        ))}
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        {rows.map((a, i) => {
          const Icon = actionIcon(a.action);
          return (
            <div key={a.id} className={`flex items-start gap-3 px-5 py-4 ${i !== 0 ? "border-t border-slate-100" : ""}`}>
              <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${actionColor(a.action)}`}>
                <Icon className="w-4 h-4" />
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-sm font-semibold text-slate-800">{a.action}</span>
                  <span style={{ fontFamily: F_MONO }} className="text-xs text-slate-400 shrink-0">{fmtClock(a.ts)}</span>
                </div>
                <div className="text-xs text-slate-500 mt-0.5">{a.detail}</div>
                <div className="text-xs text-slate-400 mt-1">{a.actor}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================== APP SHELL ============================== */
function NavItem({ icon: Icon, label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-colors ${
        active ? "bg-teal-50 text-teal-700" : "text-slate-500 hover:bg-slate-50"
      }`}
    >
      <Icon className="w-5 h-5" />
      {label}
    </button>
  );
}

const NAV_BY_ROLE = {
  outgoing: [
    { id: "new", label: "New Handover", icon: Plus },
    { id: "submitted", label: "My Submitted", icon: FileText },
  ],
  incoming: [
    { id: "queue", label: "Incoming Queue", icon: Inbox },
    { id: "mine", label: "My Patients", icon: Users },
  ],
  nurse: [{ id: "tasks", label: "Task Board", icon: ListChecks }],
  admin: [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "all", label: "All Handovers", icon: FileText },
    { id: "audit", label: "Audit Log", icon: History },
  ],
};

export default function App() {
  useFonts();
  const [user, setUser] = useState(null);
  const [handovers, setHandovers] = useState(seedHandovers);
  const [audit, setAudit] = useState(seedAudit);
  const [active, setActive] = useState(null);
  const [tab, setTab] = useState(null);
  const [mobileNav, setMobileNav] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  function login(u) {
    setUser(u);
    setTab(NAV_BY_ROLE[u.role][0].id);
  }
  function logout() {
    setUser(null);
    setTab(null);
  }

  function logAudit(action, detail) {
    setAudit((a) => [{ id: uid("a"), ts: Date.now(), actor: user.name, action, detail }, ...a]);
  }

  function createHandover(data) {
    const h = {
      id: `HO-${1000 + handovers.length + Math.floor(Math.random() * 90)}`,
      department: user.ward,
      status: "Pending Acknowledgment",
      createdBy: user.name,
      createdAt: Date.now(),
      acknowledgedBy: null,
      acknowledgedAt: null,
      ...data,
    };
    setHandovers((hs) => [h, ...hs]);
    logAudit("Handover Submitted", `${h.id} \u00b7 ${h.patientRef}`);
    if (h.overrideUsed) logAudit("Override Used", `${h.id} \u00b7 Reason: ${h.overrideReason}`);
  }

  function acknowledge(id) {
    setHandovers((hs) => hs.map((h) => (h.id === id ? { ...h, status: "Acknowledged", acknowledgedBy: user.name, acknowledgedAt: Date.now() } : h)));
    logAudit("Handover Acknowledged", `${id} \u00b7 Responsibility accepted`);
  }

  function taskStatus(hId, tId, status) {
    setHandovers((hs) => hs.map((h) => (h.id === hId ? { ...h, tasks: h.tasks.map((t) => (t.id === tId ? { ...t, status } : t)) } : h)));
    logAudit("Task Updated", `${hId} \u00b7 task status \u2192 ${status}`);
  }

  if (!user) return <LoginScreen onLogin={login} />;

  const nav = NAV_BY_ROLE[user.role];
  const pendingCount = handovers.filter((h) => h.status === "Pending Acknowledgment").length;

  return (
    <div className="min-h-screen bg-slate-50 flex" style={{ fontFamily: F_BODY }}>
      <style>{`
        @keyframes fadeIn { from { opacity:0; transform: translate(-50%,8px);} to {opacity:1; transform: translate(-50%,0);} }
        @keyframes slideIn { from { transform: translateX(24px); opacity:0 } to { transform: translateX(0); opacity:1 } }
      `}</style>

      {/* Desktop sidebar */}
      <aside className="hidden md:flex md:flex-col w-64 border-r border-slate-200 bg-white p-5 shrink-0">
        <div className="mb-8"><Logo size={34} /></div>
        <nav className="space-y-1 flex-1">
          {nav.map((n) => (
            <NavItem key={n.id} icon={n.icon} label={n.label} active={tab === n.id} onClick={() => setTab(n.id)} />
          ))}
        </nav>
        <div className="pt-4 border-t border-slate-100">
          <div className="flex items-center gap-2.5 mb-3 px-1">
            <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-bold">
              {user.name.split(" ").map(p => p[0]).slice(0,2).join("")}
            </div>
            <div className="min-w-0">
              <div className="text-xs font-semibold text-slate-800 truncate">{user.name}</div>
              <div className="text-xs text-slate-400 truncate">{user.title}</div>
            </div>
          </div>
          <button onClick={logout} className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-50">
            <LogOut className="w-3.5 h-3.5" /> Sign out
          </button>
        </div>
      </aside>

      {/* Mobile top bar */}
      <div className="md:hidden fixed top-0 inset-x-0 z-40 h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between">
        <Logo size={28} />
        <button onClick={() => setMobileNav((v) => !v)} className="p-2 rounded-lg hover:bg-slate-100">
          {mobileNav ? <X className="w-5 h-5" /> : <Menu className="w-5 h-5" />}
        </button>
      </div>
      {mobileNav && (
        <div className="md:hidden fixed top-14 inset-x-0 z-40 bg-white border-b border-slate-200 p-3 space-y-1 shadow-lg">
          {nav.map((n) => (
            <NavItem key={n.id} icon={n.icon} label={n.label} active={tab === n.id} onClick={() => { setTab(n.id); setMobileNav(false); }} />
          ))}
          <button onClick={logout} className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-50">
            <LogOut className="w-3.5 h-3.5" /> Sign out
          </button>
        </div>
      )}

      {/* Main content */}
      <main className="flex-1 px-4 sm:px-8 py-6 md:py-8 pt-20 md:pt-8 pb-24 md:pb-8 overflow-y-auto">
        {tab === "new" && <NewHandoverForm user={user} onCreate={createHandover} showToast={showToast} />}

        {tab === "submitted" && (
          <div className="max-w-4xl mx-auto">
            <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900 mb-1">My submitted handovers</h1>
            <p className="text-sm text-slate-500 mb-6">Track acknowledgment status for handovers you have created.</p>
            <div className="grid sm:grid-cols-2 gap-4">
              {handovers.filter((h) => h.createdBy === user.name).map((h) => <HandoverCard key={h.id} h={h} onOpen={setActive} />)}
            </div>
          </div>
        )}

        {tab === "queue" && (
          <div className="max-w-4xl mx-auto">
            <div className="flex items-center gap-2 mb-1">
              <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900">Incoming queue</h1>
              {pendingCount > 0 && <Pill className="bg-amber-100 text-amber-700">{pendingCount} awaiting</Pill>}
            </div>
            <p className="text-sm text-slate-500 mb-6">Review each handover and provide a one-tap digital sign-off to accept responsibility.</p>
            {handovers.filter((h) => h.status === "Pending Acknowledgment").length === 0 ? (
              <EmptyState icon={Inbox} title="Queue is clear" sub="New handovers submitted by the outgoing team will appear here." />
            ) : (
              <div className="grid sm:grid-cols-2 gap-4">
                {handovers.filter((h) => h.status === "Pending Acknowledgment").map((h) => <HandoverCard key={h.id} h={h} onOpen={setActive} />)}
              </div>
            )}
          </div>
        )}

        {tab === "mine" && (
          <div className="max-w-4xl mx-auto">
            <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900 mb-1">My patients</h1>
            <p className="text-sm text-slate-500 mb-6">Handovers you have acknowledged and are now responsible for.</p>
            <div className="grid sm:grid-cols-2 gap-4">
              {handovers.filter((h) => h.acknowledgedBy === user.name).map((h) => <HandoverCard key={h.id} h={h} onOpen={setActive} />)}
            </div>
          </div>
        )}

        {tab === "tasks" && <TaskBoard handovers={handovers} onTaskStatus={taskStatus} showToast={showToast} />}
        {tab === "dashboard" && <AdminDashboard handovers={handovers} />}
        {tab === "all" && (
          <div className="max-w-4xl mx-auto">
            <h1 style={{ fontFamily: F_DISPLAY }} className="text-xl font-bold text-slate-900 mb-1">All handovers</h1>
            <p className="text-sm text-slate-500 mb-6">Full visibility across the ward for governance and review.</p>
            <div className="grid sm:grid-cols-2 gap-4">
              {handovers.map((h) => <HandoverCard key={h.id} h={h} onOpen={setActive} />)}
            </div>
          </div>
        )}
        {tab === "audit" && <AuditLog audit={audit} />}
      </main>

      <DetailDrawer
        h={active}
        onClose={() => setActive(null)}
        onAcknowledge={acknowledge}
        onTaskStatus={taskStatus}
        canAcknowledge={user.role === "incoming"}
        showToast={showToast}
      />
      <Toast toast={toast} />
    </div>
  );
}
</script>

  <script type="module">
    const statusEl = document.getElementById('boot-status');
    const errorEl = document.getElementById('boot-error');

    function showError(title, detail) {
      errorEl.style.display = 'block';
      errorEl.textContent = title + (detail ? '\n\n' + detail : '');
    }

    try {
      const src = document.getElementById('app-source').textContent;

      if (typeof Babel === 'undefined') {
        throw new Error('Babel failed to load from CDN.');
      }

      const { code } = Babel.transform(src, {
        presets: ['react'],
        sourceType: 'module',
        filename: 'app.jsx',
      });

      const blob = new Blob([code], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);

      const mod = await import(url);
      const { createRoot } = await import('react-dom/client');
      const React = await import('react');

      const App = mod.default;
      if (!App) throw new Error('The app module has no default export.');

      createRoot(document.getElementById('root')).render(React.createElement(App));
      statusEl.classList.add('hide');
    } catch (err) {
      console.error(err);
      showError(
        'BridgeIT could not start.',
        'This usually means the device has no internet connection right now (this file loads React and icons from a CDN the first time). Reconnect and reload the page.\n\nTechnical detail: ' + (err && err.message ? err.message : String(err))
      );
    }
  </script>
</body>
</html>
